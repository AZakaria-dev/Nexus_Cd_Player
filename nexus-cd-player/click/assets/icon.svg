<?xml version="1.0" encoding="UTF-8"?>
<!--
  Placeholder development icon: a plain CD.
  Deliberately simple and self-contained: no external resources, no raster
  dependencies, no fonts. It exists so the Click package and launcher are
  valid for this proof. Branding comes later.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#8ea3b8"/>
      <stop offset="0.35" stop-color="#dfe7ef"/>
      <stop offset="0.6"  stop-color="#9fb3c6"/>
      <stop offset="1"    stop-color="#6d8296"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="36" fill="#1d2733"/>

  <!-- disc body -->
  <circle cx="128" cy="128" r="92" fill="url(#disc)"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#5b6b7c" stroke-width="2"/>

  <!-- data band -->
  <circle cx="128" cy="128" r="62" fill="none" stroke="#ffffff"
          stroke-opacity="0.28" stroke-width="10"/>

  <!-- clamping ring and spindle hole -->
  <circle cx="128" cy="128" r="34" fill="#e9eef3"/>
  <circle cx="128" cy="128" r="34" fill="none" stroke="#5b6b7c" stroke-width="2"/>
  <circle cx="128" cy="128" r="15" fill="#1d2733"/>
</svg>
